# 1. session-auth
# ─────────────────────────────────────────────────────────────────────────────
[[piece]]
name        = "session-auth"
description = "Session-key auth: approve once, play frictionlessly, renew on expiry (SessionManager lifecycle)"
maturity    = "beta"
source      = "examples/session_arena"

[[piece.files]]
target  = "session_auth/mod.rs"
content = '''
//! session_auth — session-key authorisation piece.
//!
//! Copied from examples/session_arena by `cougr add session-auth`.
//!
//! Flow: `approve_session` once → `tap` many times without wallet prompts →
//! `renew_session` before expiry → `fallback_tap` when session is stale.
//!
//! Add to your contract:
//!   1. Import the piece:  `use crate::session_auth::SessionAuth;`
//!   2. Call `SessionAuth::approve_session` from your `#[contractimpl]` impl.
//!   3. Call `SessionAuth::tap` / `SessionAuth::fallback_tap` in your game actions.

#![allow(unused_imports)]

use cougr_core::accounts::{
    GameAction, ReplayProtection, SessionBuilder, SessionStorage, SignedIntent,
};
use cougr_core::impl_component;
use cougr_core::session::{ActiveSession, SessionManager};
use soroban_sdk::{contracttype, symbol_short, Address, BytesN, Bytes, Env, Symbol};

// ── Score component ──────────────────────────────────────────────────────────

/// Simple per-player tap counter stored in instance storage.
#[contracttype]
#[derive(Clone, Debug, PartialEq)]
pub struct SessionScore {
    pub taps: u32,
}

impl_component!(SessionScore, "sess_score", Table, { taps: u32 });

// ── Session helpers ───────────────────────────────────────────────────────────

/// Thin helper that wraps the `SessionManager` lifecycle for a single action
/// called "tap".  Rename the action and score type to suit your game.
pub struct SessionAuth;

impl SessionAuth {
    /// One-time owner approval that creates a scoped session key.
    pub fn approve_session(
        env: &Env,
        owner: &Address,
        max_ops: u32,
        expires_in: u64,
    ) -> ActiveSession {
        owner.require_auth();
        let scope = SessionBuilder::new(env)
            .allow_action(symbol_short!("tap"))
            .max_operations(max_ops)
            .expires_in(expires_in)
            .build_scope();
        let key = SessionManager::approve(env, owner, scope).expect("session approved");
        let status =
            SessionManager::status(env, owner, &key.key_id).expect("session status");
        ActiveSession::from_status(&status, key.scope.expires_at)
    }

    /// Gameplay action authorised via the active session (no wallet prompt).
    pub fn tap(env: &Env, owner: &Address, key_id: &BytesN<32>) -> u32 {
        let session = SessionStorage::load(env, owner, key_id).expect("session missing");
        let action = GameAction {
            system_name: symbol_short!("tap"),
            data: Bytes::new(env),
        };
        SessionManager::execute_action(
            env,
            owner,
            &session,
            action,
            env.ledger().timestamp().saturating_add(60),
        )
        .expect("session tap");
        Self::increment_score(env, owner)
    }

    /// Extend session lifetime (owner must re-approve via wallet).
    pub fn renew_session(
        env: &Env,
        owner: &Address,
        key_id: &BytesN<32>,
        expires_in: u64,
    ) -> ActiveSession {
        owner.require_auth();
        let new_expires = env.ledger().timestamp().saturating_add(expires_in);
        let key =
            SessionManager::renew(env, owner, key_id, new_expires).expect("renewed");
        let status =
            SessionManager::status(env, owner, &key.key_id).expect("session status");
        ActiveSession::from_status(&status, key.scope.expires_at)
    }

    /// Tap using session first, falling back to direct owner auth when expired.
    pub fn fallback_tap(env: &Env, owner: &Address, key_id: &BytesN<32>) -> u32 {
        let session = SessionStorage::load(env, owner, key_id).expect("session missing");
        let action = GameAction {
            system_name: symbol_short!("tap"),
            data: Bytes::new(env),
        };
        let session_intent = SignedIntent::session(
            env,
            owner.clone(),
            key_id,
            action.clone(),
            session.next_nonce,
            env.ledger().timestamp().saturating_add(60),
        );
        let direct_intent = SignedIntent::direct(
            env,
            owner.clone(),
            action,
            ReplayProtection::next_account_nonce(env, owner),
            env.ledger().timestamp().saturating_add(60),
        );
        SessionManager::fallback_execute(env, &session_intent, &direct_intent)
            .expect("fallback tap");
        Self::increment_score(env, owner)
    }

    /// Read the current tap count for a player.
    pub fn score(env: &Env, owner: &Address) -> u32 {
        let key = (Symbol::new(env, "score"), owner.clone());
        env.storage()
            .instance()
            .get(&key)
            .map(|s: SessionScore| s.taps)
            .unwrap_or(0)
    }

    fn increment_score(env: &Env, owner: &Address) -> u32 {
        let key = (Symbol::new(env, "score"), owner.clone());
        let mut score: SessionScore = env
            .storage()
            .instance()
            .get(&key)
            .unwrap_or(SessionScore { taps: 0 });
        score.taps = score.taps.saturating_add(1);
        env.storage().instance().set(&key, &score);
        score.taps
    }
}

