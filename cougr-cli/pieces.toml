content = '''
//! hidden_hand — ZK hidden-card circuit piece.
//!
//! Copied from examples/hidden_hand by `cougr add hidden-hand`.
//!
//! Uses `cougr_core::circuits::hidden_cards` to build a Groth16 verification
//! spec for private card deals.  Both `init_table` and `verify_deal` are
//! stand-alone functions you can call from your `#[contractimpl]` impl.
//!
//! ⚠️  Maturity: Experimental — the circuit API may change between minor versions.

use cougr_core::circuits::hidden_cards;
use cougr_core::zk::Groth16Proof;
use soroban_sdk::{contracttype, symbol_short, Address, BytesN, Env, Symbol};

// ── Table configuration ───────────────────────────────────────────────────────

/// Stores the deck/hand sizes that were used to generate the circuit spec.
#[contracttype]
#[derive(Clone, Debug)]
pub struct HiddenTableConfig {
    pub deck_size: u32,
    pub hand_size: u32,
}

// ── Functions ─────────────────────────────────────────────────────────────────

/// Store deck / hand dimensions and validate the circuit spec.
pub fn init_table(env: &Env, deck_size: u32, hand_size: u32) -> HiddenTableConfig {
    let _spec = hidden_cards(env, deck_size, hand_size).expect("valid hidden-cards spec");
    let config = HiddenTableConfig { deck_size, hand_size };
    env.storage().instance().set(&table_key(env), &config);
    config
}

/// Verify a deal proof against the stored table configuration.
///
/// Returns `true` if the proof is valid for the given deck root, hand
/// commitment, and player identity.
pub fn verify_deal(
    env: &Env,
    player: &Address,
    deck_root: &BytesN<32>,
    hand_commitment: &BytesN<32>,
    proof: &Groth16Proof,
) -> bool {
    let config: HiddenTableConfig = env
        .storage()
        .instance()
        .get(&table_key(env))
        .expect("table not initialized — call init_table first");
    let spec =
        hidden_cards(env, config.deck_size, config.hand_size).expect("circuit spec");
    spec.verify_hidden_hand(env, proof, deck_root, hand_commitment, player_id(player))
        .unwrap_or(false)
}

// ── Internals ─────────────────────────────────────────────────────────────────

fn table_key(_env: &Env) -> Symbol {
    symbol_short!("hh_table")
}

/// Cheap deterministic player id derived from the first 4 address bytes.
pub fn player_id(player: &Address) -> u32 {
    let bytes = player.to_string().to_bytes();
    let mut id = 0u32;
    for i in 0..bytes.len().min(4) {
        id = id.wrapping_add(u32::from(bytes.get(i).unwrap_or(0)));
    }
    id
}

