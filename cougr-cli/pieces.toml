# Cougr piece catalog — embedded in the binary at compile time.
#
# Each [[piece]] entry describes a self-contained component/system pair (or
# standards-layer module) that `cougr add <name>` copies into the caller's
# project as owned, editable source.
#
# Fields
# ──────
# name        – unique identifier used as the CLI argument (e.g. "session-auth")
# description – one-line summary shown by `cougr add --list`
# maturity    – "stable" | "beta" | "experimental"
# source      – canonical example or module the piece is derived from
#
# [[piece.files]]
# target  – destination path relative to the project's src/ directory
# content – verbatim source that will be written to that file
#
# [[piece.cargo_deps]]
# line    – a dependency line to append to [dependencies] in Cargo.toml if absent
# dev     – true means append to [dev-dependencies] instead

