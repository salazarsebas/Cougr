content = '''
//! standards/pausable — emergency pause guard piece.
//!
//! Copied from src/standards/pausable.rs by `cougr add standards/pausable`.
//!
//! Usage in your contract:
//!
//! ```rust,ignore
//! use crate::standards::pausable::ContractPausable;
//!
//! // In your #[contractimpl]:
//! pub fn pause(env: Env, caller: Address) {
//!     caller.require_auth();
//!     ContractPausable::pause(&env, &caller).expect("pause failed");
//! }
//!
//! pub fn some_action(env: Env) {
//!     ContractPausable::require_not_paused(&env).expect("contract is paused");
//!     // … game logic …
//! }
//! ```

use cougr_core::ops::{Pausable, PausedEvent, StandardsError, UnpausedEvent};
use soroban_sdk::{symbol_short, Address, Env};

/// Contract-level pause guard using a well-known storage key.
///
/// Wrap your own logic around this type — add role checks, emit events, or
/// extend with admin-only gating as your game requires.
pub struct ContractPausable;

impl ContractPausable {
    fn pausable(env: &Env) -> Pausable {
        Pausable::new(symbol_short!("contract"))
    }

    pub fn is_paused(env: &Env) -> bool {
        Self::pausable(env).is_paused(env)
    }

    pub fn require_not_paused(env: &Env) -> Result<(), StandardsError> {
        Self::pausable(env).require_not_paused(env)
    }

    pub fn require_paused(env: &Env) -> Result<(), StandardsError> {
        Self::pausable(env).require_paused(env)
    }

    pub fn pause(env: &Env, caller: &Address) -> Result<PausedEvent, StandardsError> {
        Self::pausable(env).pause(env, caller)
    }

    pub fn unpause(env: &Env, caller: &Address) -> Result<UnpausedEvent, StandardsError> {
        Self::pausable(env).unpause(env, caller)
    }
}

#[cfg(test)]
mod tests {
    use super::*;
    use soroban_sdk::{testutils::Address as _, Address, Env};

    #[test]
    fn pause_and_unpause_round_trip() {
        let env = Env::default();
        env.mock_all_auths();
        let caller = Address::generate(&env);

        assert!(!ContractPausable::is_paused(&env));
        assert!(ContractPausable::require_not_paused(&env).is_ok());

        ContractPausable::pause(&env, &caller).unwrap();
        assert!(ContractPausable::is_paused(&env));
        assert!(ContractPausable::require_not_paused(&env).is_err());
        assert!(ContractPausable::require_paused(&env).is_ok());

        ContractPausable::unpause(&env, &caller).unwrap();
        assert!(!ContractPausable::is_paused(&env));
    }

    #[test]
    fn double_pause_returns_error() {
        let env = Env::default();
        env.mock_all_auths();
        let caller = Address::generate(&env);

        ContractPausable::pause(&env, &caller).unwrap();
        assert!(ContractPausable::pause(&env, &caller).is_err());
    }
}
