[package]
name = "staked_tournament"
version = "0.1.0"
edition = "2021"
publish = false
description = "Soroban pattern example: per-match token escrow in a single-elimination tournament bracket"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "25.1.0"

[dev-dependencies]
soroban-sdk = { version = "25.1.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true

[workspace]
