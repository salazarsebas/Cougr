  <circle cx="391" cy="91" r="1" fill="#00000044"/><circle cx="390" cy="90" r="24" fill="#f43f5e" stroke="#9f1239" stroke-width="2"/><circle cx="390" cy="90" r="14" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.5"/>
