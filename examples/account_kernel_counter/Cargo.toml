[package]
name = "account_kernel_counter"
version = "0.1.0"
edition = "2021"
publish = false
description = "Proves cougr add account-kernel is usable in a real game: counter increments gated by session-authorized actions."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "25.1.0"
cougr-core = "1.1.0"

[dev-dependencies]
soroban-sdk = { version = "25.1.0", features = ["testutils"] }
cougr-core = { version = "1.1.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true

[workspace]
