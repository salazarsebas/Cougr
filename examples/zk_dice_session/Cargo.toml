[package]
name = "zk_dice_session"
version = "0.1.0"
edition = "2021"
publish = false
description = "Cougr composition example: fair_dice ZK verification authorized through a session key - no wallet prompt per roll"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# path dep - pending cougr-core 1.x publication of circuits::* and session::*
cougr-core = { path = "../../" }
soroban-sdk = "25.1.0"

[dev-dependencies]
soroban-sdk = { version = "25.1.0", features = ["testutils"] }
cougr-core = { path = "../../", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true

[workspace]
