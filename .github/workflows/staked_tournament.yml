name: Staked Tournament Example CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'examples/staked_tournament/**'
      - '!examples/staked_tournament/**/*.md'
      - '.github/workflows/example_reusable.yml'
      - '.github/workflows/staked_tournament.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'examples/staked_tournament/**'
      - '!examples/staked_tournament/**/*.md'
      - '.github/workflows/example_reusable.yml'
      - '.github/workflows/staked_tournament.yml'

concurrency:
  group: staked_tournament-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/example_reusable.yml
    with:
      job_name: Staked Tournament Example CI
      working_directory: examples/staked_tournament
