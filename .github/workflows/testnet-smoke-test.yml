name: Testnet Smoke Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'studio/**'
      - '.github/workflows/testnet-smoke-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'studio/**'
      - '.github/workflows/testnet-smoke-test.yml'

concurrency:
  group: testnet-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testnet-smoke:
    name: Testnet Smoke Test
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Build shared design tokens
        working-directory: ./packages/tokens
        run: node build.js

      - name: Install studio dependencies
        working-directory: ./studio
        run: npm ci

      - name: Check if studio/server exists
        id: check-server
        run: |
          if [ -d "studio/server" ] || npm ls studio/server >/dev/null 2>&1; then
            echo "server_exists=true" >> $GITHUB_OUTPUT
          else
            echo "server_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run testnet smoke test
        if: steps.check-server.outputs.server_exists == 'true'
        working-directory: ./studio
        env:
          USE_REAL_SERVICES: "true"
          RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
          FRIENDBOT_URL: ${{ secrets.TESTNET_FRIENDBOT_URL }}
        run: npx vitest run tests/play-loop.spec.ts
