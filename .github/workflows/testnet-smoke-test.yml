name: Testnet Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: testnet-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testnet-smoke:
    name: Testnet Smoke Test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci
          cd studio && npm ci

      - name: Check if studio/server exists
        id: check-server
        run: |
          if npm ls studio/server >/dev/null 2>&1; then
            echo "server_exists=true" >> $GITHUB_OUTPUT
          else
            echo "server_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run testnet smoke test
        if: steps.check-server.outputs.server_exists == 'true'
        env:
          USE_REAL_SERVICES: true
          RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
          FRIENDBOT_URL: ${{ secrets.TESTNET_FRIENDBOT_URL }}
        run: |
          cd studio && npm test play-loop.spec.ts -- --useRealServices"
    }
  },
    {
      "path": "studio/README.md",
      "content": "# Studio: Local Testnet Execution

## Running with Real Services

To execute the play loop against a real testnet session and friendbot funding:

1. **Deploy `studio/server`**: Ensure the service is running locally or on a testnet endpoint.
2. **Set environment variables**:
   ```sh
   export USE_REAL_SERVICES=true
   export RPC_URL=YOUR_TESTNET_RPC_URL
   export FRIENDBOT_URL=YOUR_TESTNET_FRIENDBOT_URL
   ```
3. **Run the test suite**:
   ```sh
   cd studio && npm test play-loop.spec.ts -- --useRealServices
   ```

### Notes
- The real-service path requires a running `studio/server` instance.
- Transient RPC errors are retried with exponential backoff.
- Finality waits are enforced for real testnet transactions.
