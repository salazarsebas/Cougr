name: Core CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'internal/**'
      - 'tests/**'
      - 'benches/**'
      - 'cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/core.yml'
      - '!.github/**/*.md'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'internal/**'
      - 'tests/**'
      - 'benches/**'
      - 'cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/core.yml'
      - '!.github/**/*.md'

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Library Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --features testutils

      - name: Build library
        run: cargo build

      - name: Run hygiene check (cli)
        run: cargo run -p cougr-cli -- check --path .

      - name: Run verified check (canonical examples)
        continue-on-error: true
        run: cargo run -p cougr-cli -- check --path . --verified --canonical-only --output verified.json

      - name: Upload verified badge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-badge-report
          path: verified.json
          retention-days: 30

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32v1-none

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check against declared MSRV
        run: cargo check --workspace --all-features
