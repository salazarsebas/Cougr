name: CLI CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'cli/**'
      - '.github/workflows/cli.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'cli/**'
      - '.github/workflows/cli.yml'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cougr-workspace

      - name: Check formatting
        working-directory: ./cli
        run: cargo fmt --check

      - name: Run clippy
        working-directory: ./cli
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: ./cli
        run: cargo test

  template-tests:
    name: Generated template validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            templates:
              - 'cli/templates/**'
              - 'cli/src/template.rs'

      - name: Setup Rust
        if: steps.changes.outputs.templates == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Compile generated templates
        if: steps.changes.outputs.templates == 'true'
        run: cargo test -p cougr-cli --test cougr_new -- --ignored --nocapture
