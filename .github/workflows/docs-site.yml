name: Docs Site

on:
  push:
    branches: [main]
    paths:
      - 'cougr-site/**'
      - 'docs/**'
      - '.github/workflows/docs-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cougr-site/**'
      - 'docs/**'
      - '.github/workflows/docs-site.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync docs into cougr-site/src
        run: python3 cougr-site/sync.py

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          # 0.4.x is the last line compatible with mdbook-linkcheck 0.7.7
          mdbook-version: '0.4.43'

      - name: Install mdbook-linkcheck
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v0.7.7/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip" -o /tmp/mdbook-linkcheck.zip
          unzip -o /tmp/mdbook-linkcheck.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/mdbook-linkcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Test committed sources before generating the gallery. Example READMEs
      # copied into showcase pages are illustrative and fail rustdoc.
      - name: Run mdBook test
        working-directory: ./cougr-site
        run: mdbook test

      - name: Generate showcase gallery
        run: |
          if [ -f cougr-site/generate-showcase.py ]; then
            python3 cougr-site/generate-showcase.py
          else
            echo "generate-showcase.py not present; skipping"
          fi

      - name: Run mdBook build
        working-directory: ./cougr-site
        run: mdbook build

      - name: Upload PR Preview Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: cougr-site/book/html
          retention-days: 7

      - name: Upload GitHub Pages Artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: cougr-site/book/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
