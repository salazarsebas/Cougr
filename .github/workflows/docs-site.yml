name: Docs Site

on:
  push:
    branches: [main]
    paths:
      - 'cougr-site/**'
      - 'docs/**'
      - '.github/workflows/docs-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cougr-site/**'
      - 'docs/**'
      - '.github/workflows/docs-site.yml'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Run mdBook test
        working-directory: ./cougr-site
        # This will fail the build if embedded code blocks fail to compile
        run: mdbook test

      - name: Run mdBook build
        working-directory: ./cougr-site
        # This will fail the build if there are broken markdown links
        run: mdbook build

      - name: Upload PR Preview Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: cougr-site/book
          retention-days: 7

      - name: Upload GitHub Pages Artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: cougr-site/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only deploy to Pages if the event was a push to the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4